[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-core"
version = "0.1.0"
description = "Detection / ML layer: normalized FlowEvents -> detectors -> ThreatAlert v1.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Used by detection_core.ml.dga. Not installed by default so the core stays
# dependency-light: `import detection_core` works without these.
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["detection_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
