services:
  zeek:
    image: zeek/zeek:latest
    # For JA3/JA4 fingerprinting (encrypted-malware detection), switch to:
    #   image: activecm/zeek:8.0.6
    volumes:
      - ./pcaps:/pcaps:ro
      - ./zeek_output:/output
    working_dir: /output
    entrypoint: ["zeek"]
    # Run with:
    #   docker compose run --rm zeek -C -r /pcaps/capture.pcap local
    # Interactive shell:
    #   docker compose run --rm zeek /bin/bash
